name: CI

on:
  push:
    branches:
      - main
  pull_request:

# No `apt-get install` step. Under uv this job installed libbz2-dev, libcairo-dev and
# liblzma-dev before anything else could run, because pycairo has no Linux wheel and had to
# be compiled against system cairo headers. pixi takes pycairo from conda-forge as a
# prebuilt binary, so the runner needs nothing but pixi itself (#17).
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # `--locked` everywhere: a manifest change without a relocked file fails the job
          # rather than being silently re-resolved. This is the same guarantee
          # `uv run --locked` gave, and the reason there is exactly one lockfile.
          locked: true
          cache: true
          environments: default

      # Every step below is a Makefile entry point, run exactly as it is run locally. The
      # tools come from `pixi.lock`, so this job cannot lint or type check against a
      # different toolchain than a developer does (#9, #17).
      - name: Check Formatting
        run: |
          make check-format

      - name: Run Lint
        run: |
          make check-lint

      - name: Run Type Checks
        run: |
          make check-types

  # The matrix that used to run 3.13 and 3.14 is a single 3.13 job. On linux-64 there is no
  # way to resolve Python 3.14 without compiling one of the two binary dependencies: pysam
  # has no cp314 wheel on PyPI, and every bioconda pysam build for 3.14 on that platform
  # requires the free-threaded ABI, for which conda-forge has no pycairo. See the long note
  # in pyproject.toml. `requires-python = ">=3.13"` still permits 3.14, it is just untested.
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          locked: true
          cache: true
          environments: default

      - name: Run tests
        run: |
            make test
