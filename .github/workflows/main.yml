name: CI

on:
  push:
    branches:
      - main
  pull_request:

# No `apt-get install` step. The job used to install libbz2-dev, libcairo-dev and liblzma-dev
# before anything else could run, because pycairo had no Linux wheel and had to be compiled
# against system cairo headers; that is what pixi was adopted for (#17). pycairo is gone
# since #37 and the pysam wheel bundles htslib, so every dependency is now a PyPI wheel and
# the runner needs nothing but uv itself (#38).
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Every step below is a Makefile entry point, run exactly as it is run locally. Each
      # one goes through `uv run --locked`, so a manifest change without a relocked file
      # fails the job rather than being silently re-resolved, and this job cannot lint or
      # type check against a different toolchain than a developer does (#9, #17, #38).
      - name: Check Formatting
        run: |
          make check-format

      - name: Run Lint
        run: |
          make check-lint

      - name: Run Type Checks
        run: |
          make check-types

  # A single 3.13 job, from `.python-version`. The matrix that used to run 3.13 and 3.14 was
  # dropped because 3.14 could not be resolved without compiling pysam; pysam 0.24.0 has since
  # published cp314 wheels, so that reason is gone and only the scope of #38 keeps the leg
  # out. See the note in pyproject.toml. `requires-python = ">=3.13"` still permits 3.14.
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run tests
        run: |
            make test
