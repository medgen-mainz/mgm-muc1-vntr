name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - run: |
            sudo apt-get install -y \
                libbz2-dev \
                libcairo-dev \
                liblzma-dev

      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # Every step below is a Makefile entry point, run exactly as it is run locally. The
      # tools come from `uv.lock` via `uv run --locked`, so this job cannot lint or type
      # check against a different toolchain than a developer does, and a `uv.lock` gone
      # stale against `pyproject.toml` fails the step instead of being silently re-solved
      # (#9).
      - name: Check Formatting
        run: |
          make check-format

      - name: Run Lint
        run: |
          make check-lint

      - name: Run Type Checks
        run: |
          make check-types

  testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.13'
          - '3.14'
    steps:
      - run: |
            sudo apt-get install -y \
                libbz2-dev \
                libcairo-dev \
                liblzma-dev

      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Run tests
        run: |
            make test
