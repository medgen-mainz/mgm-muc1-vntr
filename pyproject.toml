[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{name = "Manuel Holtgrewe"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "biopython>=1.86",
    "loguru>=0.7.3",
    "pycairo>=1.28.0",
    "pydantic>=2.12.4",
    "pysam>=0.23.3",
    "typer>=0.20.0",
]
description = "MUC1 VNTR analysis for short- and long-read sequencing data"
keywords = []
name = "mgm_muc1_vntr"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.13"

[project.scripts]
mgm-muc1-vntr = "mgm_muc1_vntr.__main__:main"

[project.urls]
Documentation = "https://github.com/medgen-mainz/mgm_muc1_vntr"
Issues = "https://github.com/medgen-mainz/mgm_muc1_vntr/issues"
Source = "https://github.com/medgen-mainz/mgm_muc1_vntr"

[tool.hatch.version]
path = "src/mgm_muc1_vntr/version.py"

[dependency-groups]
dev = [
    "black==25.9.0",
    "build>=1.2",
    "coverage>=7.10.7",
    "docutils>=0.18.1,<0.22",
    "flake8>=3.6.0",
    "pyright",
    "pytest-cache>=1.0",
    "pytest-cov",
    "pytest-cov>=2.4.0",
    "pytest-sugar>=0.8.0",
    "pytest>=3.0.6",
    "ruff>=0.14.4",
    "syrupy>=5.0.0",
]

# There are deliberately no `[tool.hatch.envs.*]` sections. `make check` and `make test` run
# every tool through `pixi run --locked`, so `pixi.lock` governs what actually executes. The
# hatch `quality`, `tests`, `docs` and `build` environments each carried `installer = "uv"`
# and resolved themselves fresh against the index, which made the lockfile decorative --
# nothing in hatch reads a lockfile, and `installer` selects the installer, not the
# resolver (#9). The commands live in the Makefile.
#
# `hatchling` in `[build-system]`, `[tool.hatch.version]` and the `[tool.hatch.build.targets.*]`
# sections all stay: the build backend never had an environment and never drifted. It is the
# hatch *environment manager* that is gone, and with it the `hatch` dev dependency.
#
# The same reasoning is why there is one environment manager and not two. pixi replaced uv
# outright in #17; `uv.lock` is deleted, not kept alongside `pixi.lock`. Two lockfiles is the
# shape of the bug #9 fixed.

# pycairo is the reason this project uses pixi at all. It publishes Windows wheels and
# nothing else, so every Linux and macOS install compiled it from the sdist against system
# cairo headers, which is what the `sudo apt install libcairo-dev` prerequisite was for.
# Taking it from conda-forge removes that step entirely (#17).
#
# pysam is deliberately *not* a conda dependency. Its PyPI wheels are auditwheel-repaired
# manylinux and macOS builds with htslib bundled in, so on 3.13 they need no system bzip2 or
# lzma either; those two apt packages were only ever required by the 3.14 source build. The
# bioconda pysam was tried and rejected: pixi's conda-to-PyPI name mapping covers conda-forge
# only, so a bioconda pysam is not recognised as satisfying the `pysam` requirement in
# `[project.dependencies]` and gets installed a second time from PyPI on top of itself.
#
# Keeping exactly one package on the conda side is also what makes this migration
# reviewable: every other version in the tree is the one uv already resolved.
[tool.pixi.workspace]
channels = ["conda-forge"]
# win-64 is absent deliberately: pysam publishes no Windows wheel and bioconda has no
# Windows build either, so the platform is not supportable regardless of package manager.
# linux-aarch64 is here for the arm64 container image (#7).
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
pycairo = ">=1.28.0"

# pixi does not install the project into its own environment implicitly the way `uv run`
# did, so the `mgm-muc1-vntr` console script would not exist without this. Editable, so a
# source edit is picked up without a reinstall. The container image (#7) needs the source
# tree present alongside the environment for this to resolve, or a non-editable install of
# its own.
[tool.pixi.pypi-dependencies]
mgm_muc1_vntr = { path = ".", editable = true }

# The `build` glob excludes the free-threaded interpreters. Without it the solver may pick
# `*_cp313t` on some platforms and not others, and conda-forge builds no pycairo against the
# free-threaded ABI, so pixi would silently fall back to compiling the pycairo sdist from
# PyPI -- the exact thing this migration removes.
[tool.pixi.feature.py313.dependencies]
python = { version = "3.13.*", build = "*_cp313" }

# Why there is no py314 environment
# ---------------------------------
# The uv matrix tested 3.13 and 3.14. Under pixi the 3.14 leg cannot be honoured on linux-64,
# the only platform CI and the container image run on, by either route:
#
#   - From PyPI, pysam has no cp314 wheel, so it builds htslib from source and needs
#     libbz2-dev and liblzma-dev back.
#   - From bioconda, every pysam build for 3.14 on linux-64, across 0.23.3 and 0.24.0 and
#     every build number, declares `python_abi 3.14.* *_cp314t`, that is free-threaded only.
#     osx-64, osx-arm64 and linux-aarch64 have ordinary `*_cp314` builds; linux-64 does not.
#     Resolving it there drags in the free-threaded interpreter, for which conda-forge has no
#     pycairo, so pycairo reverts to a compiled sdist.
#
# Both paths reintroduce the prerequisite this migration exists to delete, so the 3.14 leg is
# dropped rather than quietly compiling something. `requires-python = ">=3.13"` is unchanged,
# so 3.14 is still permitted, it is simply no longer covered by CI. Restoring it is a
# four-line change once either upstream ships a usable 3.14 build for linux-64.

# `prod` shares a solve group with `default`, so the container image (#7) gets byte-identical
# pycairo, pysam and runtime versions to the ones the tests ran against, minus the dev tools.
[tool.pixi.environments]
default = { features = ["py313", "dev"], solve-group = "py313" }
prod = { features = ["py313"], solve-group = "py313" }

[tool.pyright]
include = ["src/mgm_muc1_vntr", "examples"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
defineConstant = { DEBUG = true }
stubPath = "src/stubs"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.ruff]
lint.ignore = [
  "E501", # line too long, handled by black
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
  # the following are known issues in generated code
  "E721", # is vs. ==
  "C409", # Unnecessary list literal
  "B028", # No stacklevel in warnings.warn
  "B904", # raise from e not used
  "C405", # Unnecessary list literal (rewrite as set literal)
  "C402", # inconvenient dictionary creation
]
lint.select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "C", # flake8-comprehensions
  "B", # flake8-bugbear
]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = "--doctest-modules"

[tool.ruff.lint.isort]
known-first-party = ["src/mgm_muc1_vntr"]

[tool.hatch.build.targets.wheel]
packages = ["src/mgm_muc1_vntr"]

[tool.hatch.build.targets.sdist]
packages = ["src/mgm_muc1_vntr"]
exclude = [
  "/.editorconfig",
  "/Makefile",
  "/.gitignore",
  "/.github",
  "/.vscode",
  "/.gitignore",
  "/tests",
]
