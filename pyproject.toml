[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{name = "Manuel Holtgrewe"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "biopython>=1.86",
    "loguru>=0.7.3",
    "pycairo>=1.28.0",
    "pydantic>=2.12.4",
    "pysam>=0.23.3",
    "typer>=0.20.0",
]
description = "MUC1 VNTR analysis for short- and long-read sequencing data"
keywords = []
name = "mgm_muc1_vntr"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.13"

[project.scripts]
mgm-muc1-vntr = "mgm_muc1_vntr.__main__:main"

[project.urls]
Documentation = "https://github.com/medgen-mainz/mgm_muc1_vntr"
Issues = "https://github.com/medgen-mainz/mgm_muc1_vntr/issues"
Source = "https://github.com/medgen-mainz/mgm_muc1_vntr"

[tool.hatch.version]
path = "src/mgm_muc1_vntr/version.py"

[dependency-groups]
dev = [
    "black==25.9.0",
    "coverage>=7.10.7",
    "docutils>=0.18.1,<0.22",
    "flake8>=3.6.0",
    "pyright",
    "pytest-cache>=1.0",
    "pytest-cov",
    "pytest-cov>=2.4.0",
    "pytest-sugar>=0.8.0",
    "pytest>=3.0.6",
    "ruff>=0.14.4",
    "syrupy>=5.0.0",
]

# There are deliberately no `[tool.hatch.envs.*]` sections. `make check` and `make test` run
# every tool through `uv run --locked`, so `uv.lock` governs what actually executes. The
# hatch `quality`, `tests`, `docs` and `build` environments each carried `installer = "uv"`
# and resolved themselves fresh against the index, which made the lockfile decorative --
# nothing in hatch reads a lockfile, and `installer` selects the installer, not the
# resolver (#9). The commands live in the Makefile.
#
# `hatchling` in `[build-system]`, `[tool.hatch.version]` and the `[tool.hatch.build.targets.*]`
# sections all stay: the build backend never had an environment and never drifted. It is the
# hatch *environment manager* that is gone, and with it the `hatch` dev dependency.

[tool.pyright]
include = ["src/mgm_muc1_vntr", "examples"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
defineConstant = { DEBUG = true }
stubPath = "src/stubs"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.ruff]
lint.ignore = [
  "E501", # line too long, handled by black
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
  # the following are known issues in generated code
  "E721", # is vs. ==
  "C409", # Unnecessary list literal
  "B028", # No stacklevel in warnings.warn
  "B904", # raise from e not used
  "C405", # Unnecessary list literal (rewrite as set literal)
  "C402", # inconvenient dictionary creation
]
lint.select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "C", # flake8-comprehensions
  "B", # flake8-bugbear
]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = "--doctest-modules"

[tool.ruff.lint.isort]
known-first-party = ["src/mgm_muc1_vntr"]

[tool.hatch.build.targets.wheel]
packages = ["src/mgm_muc1_vntr"]

[tool.hatch.build.targets.sdist]
packages = ["src/mgm_muc1_vntr"]
exclude = [
  "/.editorconfig",
  "/Makefile",
  "/.gitignore",
  "/.github",
  "/.vscode",
  "/.gitignore",
  "/tests",
]
