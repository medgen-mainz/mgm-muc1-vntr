[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{name = "Manuel Holtgrewe"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "biopython>=1.86",
    "loguru>=0.7.3",
    "pydantic>=2.12.4",
    "pysam>=0.23.3",
    "typer>=0.20.0",
]
description = "MUC1 VNTR analysis for short- and long-read sequencing data"
keywords = []
name = "mgm_muc1_vntr"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.13"

[project.scripts]
mgm-muc1-vntr = "mgm_muc1_vntr.__main__:main"

[project.urls]
Documentation = "https://github.com/medgen-mainz/mgm_muc1_vntr"
Issues = "https://github.com/medgen-mainz/mgm_muc1_vntr/issues"
Source = "https://github.com/medgen-mainz/mgm_muc1_vntr"

[tool.hatch.version]
path = "src/mgm_muc1_vntr/version.py"

[dependency-groups]
dev = [
    "black==25.9.0",
    "build>=1.2",
    "coverage>=7.10.7",
    "docutils>=0.18.1,<0.22",
    "flake8>=3.6.0",
    "pyright",
    "pytest-cache>=1.0",
    "pytest-cov",
    "pytest-cov>=2.4.0",
    "pytest-sugar>=0.8.0",
    "pytest>=3.0.6",
    "ruff>=0.14.4",
    "syrupy>=5.0.0",
]

# There are deliberately no `[tool.hatch.envs.*]` sections. `make check` and `make test` run
# every tool through `uv run --locked`, so `uv.lock` governs what actually executes. The
# hatch `quality`, `tests`, `docs` and `build` environments each carried `installer = "uv"`
# and resolved themselves fresh against the index, which made the lockfile decorative --
# nothing in hatch reads a lockfile, and `installer` selects the installer, not the
# resolver (#9). The commands live in the Makefile.
#
# `hatchling` in `[build-system]`, `[tool.hatch.version]` and the `[tool.hatch.build.targets.*]`
# sections all stay: the build backend never had an environment and never drifted. It is the
# hatch *environment manager* that is gone, and with it the `hatch` dev dependency.
#
# The same reasoning is why there is one environment manager and not two. uv replaced pixi
# outright in #38 and `pixi.lock` is deleted, not kept alongside `uv.lock`, exactly as
# `uv.lock` was deleted when pixi arrived in #17. Two lockfiles is the shape of the bug #9
# fixed. pixi was adopted for one dependency, pycairo, which published Windows wheels only
# and had to be compiled against system cairo headers everywhere else; #37 removed pycairo
# and left the conda side with nothing to do.

# pysam is why the conda side looked necessary and why it is not. Its PyPI wheels are
# auditwheel-repaired manylinux and macOS builds with htslib bundled in, so they need no
# system bzip2 or lzma. The bioconda build was tried under pixi and rejected: pixi's
# conda-to-PyPI name mapping covers conda-forge only, so a bioconda pysam was not recognised
# as satisfying the `pysam` requirement and got installed a second time from PyPI on top of
# itself.
#
# What replaces pixi's `platforms` list is nothing declarative. `uv.lock` is a universal
# resolution, so every platform is already in it, and `[tool.uv] required-environments` is
# not the equivalent it looks like: it demands a resolvable artefact, and an sdist counts, so
# it would pass on a package that had lost its arm64 wheel. Verified by hand instead, and the
# check is one command:
#
#   uv export --no-dev --no-emit-project -o /tmp/prod.txt
#   uv pip install --dry-run --only-binary :all: \
#       --python-platform aarch64-manylinux_2_28 --python-version 3.13 -r /tmp/prod.txt
#
# All 16 runtime packages have arm64 wheels, which is what the arm64 container image (#7)
# needs. Windows is unsupportable either way, pysam publishes no Windows wheel.

# Why CI has no 3.14 leg
# ----------------------
# The reason recorded here under pixi no longer holds and is not being quietly restated.
# pysam 0.24.0, released 2026-04-27, publishes cp314 manylinux wheels for x86_64 and
# aarch64, so `pysam>=0.23.3` on 3.14 no longer compiles htslib and no longer needs
# libbz2-dev and liblzma-dev. The same dry run as above with `--python-version 3.14`
# resolves the whole runtime set from wheels, and `uv run --python 3.14 pytest` passes
# locally. The 3.14 leg stays out of this pull request only because it swaps the tooling
# and should not also change what CI covers; restoring the matrix is a separate change.

# Fixture generation is the one thing that genuinely wanted conda, and it is no longer wired
# into the environment manager. bwa, samtools and wgsim are bioconda-only with no PyPI
# distribution, so the `fixtures` pixi environment (#33) cannot be expressed in `uv.lock` and
# went with pixi. The tools are installed by hand now; tests/data/README.md says how, and it
# carries the MucOneUp commit that `pixi.lock` used to record, since a git tag is mutable and
# the tag pin in make_synthetic_fixtures.sh alone would not pin the simulator.
#
# This is a maintainer-only path, run when a fixture is regenerated. The fixtures themselves
# are committed via Git LFS, so nothing in `make check`, `make test` or the image depends on
# it. Keeping pixi alive for this one environment was the alternative and was rejected: it
# means two environment managers and two lockfiles, which is what #9 fixed.

[tool.pyright]
include = ["src/mgm_muc1_vntr", "examples"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
defineConstant = { DEBUG = true }
stubPath = "src/stubs"

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.ruff]
lint.ignore = [
  "E501", # line too long, handled by black
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
  # the following are known issues in generated code
  "E721", # is vs. ==
  "C409", # Unnecessary list literal
  "B028", # No stacklevel in warnings.warn
  "B904", # raise from e not used
  "C405", # Unnecessary list literal (rewrite as set literal)
  "C402", # inconvenient dictionary creation
]
lint.select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "C", # flake8-comprehensions
  "B", # flake8-bugbear
  "ARG", # flake8-unused-arguments
]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
addopts = "--doctest-modules"

# 100% is a ratchet, not an aspiration: without `fail_under` the next PR quietly erodes it.
# The suite reaches it with no `# pragma: no cover` anywhere, and the three statements that
# used to make that impossible are now `assert`s stating the invariant that made them
# unreachable (#23).
#
# Statement coverage, deliberately. `--cov-branch` sits at 98%, the partial arcs being mostly
# loop exits, and closing the rest needs a synthetic SRS BAM with chosen CIGARs. Worth doing
# separately, not as a condition of this gate.
[tool.coverage.report]
fail_under = 100

[tool.ruff.lint.isort]
known-first-party = ["src/mgm_muc1_vntr"]

[tool.hatch.build.targets.wheel]
packages = ["src/mgm_muc1_vntr"]

[tool.hatch.build.targets.sdist]
packages = ["src/mgm_muc1_vntr"]
exclude = [
  "/.editorconfig",
  "/Makefile",
  "/.gitignore",
  "/.github",
  "/.vscode",
  "/.gitignore",
  "/tests",
]
